name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run fmt:check
      - run: bun run check:electron
      - run: bun run check:renderer
      - run: bun run test
      - run: bun run build

  supervisor-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun run test:supervisor:image
      # Integration tests need a working bwrap sandbox, which the GitHub
      # runner can't provide (nested privileged container); they self-skip
      # without CAPYBARA_SUPERVISOR_INTEGRATION. CI runs the unit tests only;
      # run `bun run test:supervisor` locally for the full integration suite.
      - run: bun run test:supervisor:ci
