name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
            label: mac-arm64
          - os: macos-13
            arch: x64
            label: mac-x64
          # Windows is deferred: Lima doesn't run on Windows; the VM
          # lifecycle in electron/vm.ts is macOS-only. Re-enable once
          # the Windows VM strategy lands (WSL2 + bwrap or similar) and
          # `runtime-manifest.json` gains win32 entries.
          # - os: windows-latest
          #   arch: x64
          #   label: win-x64

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.label }})

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-${{ matrix.arch }}-bun-${{ hashFiles('bun.lock') }}

      - name: Cache runtimes
        # The Bun binary + Lima bundle fetched by setup:runtimes. fetch-runtimes
        # skips the download when these exist, so a hit makes dist:prepare's
        # setup:runtimes step a no-op. Keyed on the manifest (the pinned URLs +
        # sha256) so a runtime bump busts the cache.
        uses: actions/cache@v5
        with:
          path: |
            binaries
            vendor/lima
          key: ${{ runner.os }}-${{ matrix.arch }}-runtimes-${{ hashFiles('runtime-manifest.json') }}

      - name: Install
        # Each runner installs on its native arch so the right SDK platform
        # package + Bun binary land in node_modules / binaries.
        run: bun install --frozen-lockfile

      - name: Prepare runtimes + bundles
        run: bun run dist:prepare

      - name: Build
        # --mac --<arch>: package only this runner's arch (beforePack stages a
        # single Bun binary for it). --publish never: the `release` job owns
        # publishing; without this, a v* tag makes electron-builder implicitly
        # publish to GitHub itself (deprecated, and needs a token we don't pass).
        #
        # GitHub injects an unset secret as "" (not absent), and CSC_LINK=""
        # makes electron-builder resolve it as a cert path → the project dir →
        # "<dir> not a file". So when no cert is configured, unset the signing
        # vars and disable identity auto-discovery for a clean unsigned build.
        # Populate the secrets to sign + notarize for real.
        run: |
          if [ -z "$CSC_LINK" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          bun x electron-builder --mac --${{ matrix.arch }} --publish never
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - uses: actions/upload-artifact@v7
        with:
          name: capybara-${{ matrix.label }}
          path: |
            release/*.dmg
            release/latest*.yml
          if-no-files-found: ignore

  # Gather every arch's DMG and attach them to a GitHub Release so there's a
  # stable download URL. Tag-only: workflow_dispatch runs still produce build
  # artifacts but don't cut a Release.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: capybara-*
          merge-multiple: true
          path: dist-artifacts

      # Only the DMGs go on the Release. The per-arch latest*.yml update feeds
      # collide on one filename across arches — wiring electron-updater is a
      # separate task, deferred until there's an auto-update consumer.
      - uses: softprops/action-gh-release@v2
        with:
          files: dist-artifacts/*.dmg
          fail_on_unmatched_files: true
